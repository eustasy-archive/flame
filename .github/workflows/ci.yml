name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Build, test, check types, dry-run deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: server/package-lock.json

      # Also generates the Worker's types (postinstall runs `wrangler types`).
      - name: Install
        run: npm ci

      - name: Build the client
        run: npm run build

      - name: Test
        run: npm test

      - name: Check types
        run: npm run check

      # Bundles the Worker as `wrangler deploy` would, without deploying.
      - name: Dry-run deploy
        run: npx wrangler deploy --dry-run --outdir dist/worker
